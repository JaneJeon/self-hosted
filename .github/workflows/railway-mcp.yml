name: Railway MCP configuration

on:
  pull_request:
    paths:
      - .railway/**
      - .github/workflows/railway-mcp.yml
  push:
    branches:
      - codex/railway-mcp
      - master
    paths:
      - .railway/**
      - .github/workflows/railway-mcp.yml

permissions:
  contents: read

concurrency:
  group: railway-mcp-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    uses: ./.github/workflows/whatsapp-backup.yml
  transport:
    uses: ./.github/workflows/mcp-transport.yml
  query-policy:
    uses: ./.github/workflows/whatsapp-trial.yml
  apply:
    needs: [backup, transport, query-policy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --global @railway/cli@5.54.1
      - name: Validate and apply the pinned MCP plan
        run: python3 .railway/apply-mcp.py
